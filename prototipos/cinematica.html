<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Analista · cinemática de muestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Nunito:wght@400..800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html,body{margin:0;background:#2A2440;font-family:Nunito,system-ui,sans-serif}
  .ea-root{--tinta:#2A2440;--tinta2:#3B3358;--papel:#FFF8EA;--crema:#FFF4DC;--arena:#F3E2BF;--mostaza:#F2B632;
    --naranja:#E9875A;--terracota:#D9643A;--cobre:#B24E27;--lila:#8C6BB1;--lila2:#5B4785;--verde:#2F8A54;--rojo:#B0321F;--tenue:#CFC4EA}
  .demo{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .demoFin{color:var(--crema);text-align:center;font-family:'Bricolage Grotesque',sans-serif}
  .demoFin button{margin-top:16px}

  /* ---- la cinemática ---- */
  .ea-cine{position:relative;width:100%;max-width:720px;aspect-ratio:16/11;border-radius:22px;overflow:hidden;
    background:var(--tinta);box-shadow:0 18px 50px rgba(0,0,0,.35);user-select:none;cursor:pointer;
    animation:ea-cineEntra .5s ease-out}
  @keyframes ea-cineEntra{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .ea-cineEsc{position:absolute;inset:0;width:100%;height:100%}
  .ea-cineLugar{position:absolute;top:14px;left:16px;font:700 11px 'Bricolage Grotesque',sans-serif;letter-spacing:.18em;
    text-transform:uppercase;color:var(--crema);background:rgba(42,36,64,.55);padding:6px 10px;border-radius:999px}
  .ea-cineSaltar{position:absolute;top:12px;right:14px;font:700 12px Nunito,sans-serif;color:var(--crema);
    background:rgba(42,36,64,.55);border:0;border-radius:999px;padding:7px 12px;cursor:pointer}
  .ea-cineCaja{position:absolute;left:12px;right:12px;bottom:12px;background:var(--tinta);color:var(--crema);
    border-radius:16px;padding:22px 18px 16px;min-height:72px;box-shadow:0 -2px 0 rgba(255,255,255,.06) inset}
  .ea-cineQuien{position:absolute;top:-13px;left:16px;background:var(--mostaza);color:var(--tinta);
    font:800 12px 'Bricolage Grotesque',sans-serif;letter-spacing:.06em;padding:5px 11px;border-radius:999px}
  .ea-cineTxt{font-size:17px;line-height:1.45;margin:0;min-height:50px}
  .ea-cineMas{position:absolute;right:16px;bottom:10px;color:var(--mostaza);font-size:13px;animation:ea-cineParpadea 1s infinite}
  @keyframes ea-cineParpadea{50%{opacity:.2}}
  .ea-persona{transition:transform .35s ease}
  .ea-persona.habla{animation:ea-cineHabla .45s ease-in-out infinite alternate}
  @keyframes ea-cineHabla{to{transform:translateY(-3px)}}
  .ea-persona.entra-i{animation:ea-cineEntraI .6s ease-out}
  .ea-persona.entra-d{animation:ea-cineEntraD .6s ease-out}
  @keyframes ea-cineEntraI{from{transform:translateX(-60px);opacity:0}}
  @keyframes ea-cineEntraD{from{transform:translateX(60px);opacity:0}}
  .ea-cineSol{animation:ea-cineSol 9s ease-in-out infinite alternate}
  @keyframes ea-cineSol{to{transform:translateY(6px)}}
  .ea-cineNube{animation:ea-cineNube 26s linear infinite}
  @keyframes ea-cineNube{from{transform:translateX(-40px)}to{transform:translateX(60px)}}

  /* ---- la firma ---- */
  .ea-firma{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(42,36,64,.55);
    animation:ea-cineEntra .4s ease-out;cursor:default}
  .ea-firmaDoc{background:var(--papel);color:var(--tinta);width:min(86%,420px);border-radius:14px;padding:20px 22px 18px;
    box-shadow:0 14px 40px rgba(0,0,0,.35);animation:ea-firmaSube .5s cubic-bezier(.2,1.2,.4,1)}
  @keyframes ea-firmaSube{from{transform:translateY(40px) rotate(-2deg);opacity:0}}
  .ea-firmaT{font:800 19px 'Bricolage Grotesque',sans-serif;margin:0 0 2px}
  .ea-firmaS{font-size:12px;color:#665C7A;margin:0 0 12px}
  .ea-firmaFila{display:flex;justify-content:space-between;border-top:1px dashed #E2CFA8;padding:8px 0;font-size:14px}
  .ea-firmaFila b{font-family:'Bricolage Grotesque',sans-serif}
  .ea-firmaLinea{position:relative;margin-top:10px;height:56px;border-bottom:2px solid var(--tinta)}
  .ea-firmaLinea span{position:absolute;bottom:-20px;left:0;font-size:11px;color:#665C7A}
  .ea-firmaTrazo{position:absolute;left:6px;bottom:4px;width:200px;height:50px}
  .ea-firmaTrazo path{fill:none;stroke:#1F3A8A;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:600;stroke-dashoffset:600;animation:ea-firmaTraza 1.3s ease-out forwards}
  @keyframes ea-firmaTraza{to{stroke-dashoffset:0}}
  .ea-firmaSello{position:absolute;right:4px;bottom:6px;font:800 12px 'Bricolage Grotesque',sans-serif;color:var(--verde);
    border:2px solid var(--verde);border-radius:8px;padding:4px 8px;transform:rotate(-8deg);opacity:0;animation:ea-firmaSella .3s 1.3s forwards}
  @keyframes ea-firmaSella{from{opacity:0;transform:rotate(-8deg) scale(1.6)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
  .ea-btnC{margin-top:26px;width:100%;border:0;border-radius:999px;background:var(--mostaza);color:var(--tinta);
    font:800 15px 'Bricolage Grotesque',sans-serif;padding:13px;cursor:pointer;box-shadow:0 3px 0 #C98F12}
  .ea-btnC:disabled{opacity:.5}
  @media (prefers-reduced-motion:reduce){.ea-root *{animation-duration:1ms!important;transition-duration:1ms!important}}
  @media (max-width:520px){.ea-cineTxt{font-size:15px}.ea-cine{aspect-ratio:3/4}}
</style>
</head>
<body>
<div id="raiz"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ============================================================
   LAS PERSONAS
   Ilustración plana, como los juegos de SurEconomics: sin contornos,
   formas redondas y colores de la paleta. Cada persona es un «look»
   (piel, pelo, ropa) y un gesto (cara) que cambia mientras habla.
   ============================================================ */
const BOCAS = {
  neutro: "M-7 14 Q0 16 7 14",
  feliz: "M-9 12 Q0 22 9 12",
  serio: "M-7 15 L7 15",
  triste: "M-8 17 Q0 10 8 17",
  sorpresa: "M-4 14 a4 5 0 1 0 8 0 a4 5 0 1 0 -8 0",
};
const CEJAS = {
  neutro: [-2, 0], feliz: [-3, 0], serio: [1, 6], triste: [-1, -8], sorpresa: [-6, 0],
};
function Persona({ look, gesto = "neutro", x, y = 0, escala = 1, mira = 1, habla, entra }) {
  const g = BOCAS[gesto] ? gesto : "neutro";
  const [alto, giro] = CEJAS[g];
  const clase = "ea-persona" + (habla ? " habla" : "") + (entra ? " entra-" + entra : "");
  return (
    <g transform={`translate(${x} ${y}) scale(${escala * mira} ${escala})`}>
      <g className={clase}>
        {/* cuerpo */}
        <path d="M-46 160 Q-46 92 0 88 Q46 92 46 160 Z" fill={look.ropa} />
        {look.corbata && <path d="M-5 92 L5 92 L8 130 L0 142 L-8 130 Z" fill={look.corbata} />}
        <path d="M-14 88 L0 104 L14 88 Z" fill={look.cuello || "#FFF4DC"} />
        {/* cuello y cabeza */}
        <rect x="-9" y="66" width="18" height="26" rx="8" fill={look.piel} />
        <ellipse cx="0" cy="40" rx="30" ry="34" fill={look.piel} />
        {/* pelo */}
        {look.pelo === "corto" && <path d="M-31 34 Q-32 4 0 2 Q32 4 31 34 Q22 16 0 16 Q-20 16 -31 34 Z" fill={look.colorPelo} />}
        {look.pelo === "largo" && <path d="M-33 70 Q-40 8 0 2 Q40 8 33 70 Q28 30 18 20 Q0 26 -18 20 Q-28 30 -33 70 Z" fill={look.colorPelo} />}
        {look.pelo === "calvo" && <path d="M-31 40 Q-31 24 -22 20 L-22 40 Z M31 40 Q31 24 22 20 L22 40 Z" fill={look.colorPelo} />}
        {look.lentes && <g fill="none" stroke="#2A2440" strokeWidth="2.4"><circle cx="-11" cy="40" r="8" /><circle cx="11" cy="40" r="8" /><path d="M-3 40 L3 40" /></g>}
        {/* cara: cejas, ojos y boca según el gesto */}
        <g fill="#2A2440">
          <rect x="-17" y={28 + alto} width="11" height="3" rx="1.5" transform={`rotate(${giro} -11 ${29 + alto})`} />
          <rect x="6" y={28 + alto} width="11" height="3" rx="1.5" transform={`rotate(${-giro} 11 ${29 + alto})`} />
          <circle cx="-11" cy="41" r="3.4" /><circle cx="11" cy="41" r="3.4" />
        </g>
        <g transform="translate(0 40)">
          <path d={BOCAS[g]} fill={g === "sorpresa" ? "#2A2440" : "none"} stroke="#2A2440" strokeWidth="3" strokeLinecap="round" />
        </g>
        <circle cx="-20" cy="52" r="5" fill="#E9875A" opacity=".35" />
        <circle cx="20" cy="52" r="5" fill="#E9875A" opacity=".35" />
      </g>
    </g>
  );
}

/* ============================================================
   LOS LUGARES
   Fondos de 720 × 495: una oficina al atardecer, con la ciudad en
   silueta por la ventana, como Caracas en «Vuela, guacamaya».
   ============================================================ */
function Oficina() {
  return (
    <g>
      <defs>
        <linearGradient id="cieloTarde" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#5B4785" /><stop offset=".55" stopColor="#D9643A" /><stop offset="1" stopColor="#F2B632" />
        </linearGradient>
      </defs>
      {/* pared */}
      <rect width="720" height="495" fill="#F3E2BF" />
      <rect y="300" width="720" height="195" fill="#E2CFA8" />
      {/* ventana grande */}
      <rect x="150" y="40" width="420" height="240" rx="14" fill="url(#cieloTarde)" />
      <g className="ea-cineSol"><circle cx="440" cy="196" r="44" fill="#F2B632" /></g>
      <g className="ea-cineNube" fill="#FFF4DC" opacity=".55">
        <ellipse cx="250" cy="96" rx="40" ry="10" /><ellipse cx="280" cy="88" rx="26" ry="9" />
      </g>
      <path d="M150 236 Q240 200 330 222 T570 210 L570 280 L150 280 Z" fill="#8C6BB1" />
      <g fill="#3B3358">
        <rect x="170" y="196" width="26" height="84" /><rect x="204" y="170" width="34" height="110" />
        <rect x="246" y="214" width="22" height="66" /><rect x="380" y="186" width="30" height="94" />
        <rect x="418" y="160" width="40" height="120" /><rect x="466" y="204" width="24" height="76" />
        <rect x="500" y="180" width="36" height="100" /><rect x="300" y="226" width="28" height="54" />
      </g>
      <g fill="#F2B632" opacity=".85">
        <rect x="212" y="182" width="5" height="6" /><rect x="224" y="196" width="5" height="6" /><rect x="426" y="176" width="5" height="6" />
        <rect x="440" y="200" width="5" height="6" /><rect x="510" y="196" width="5" height="6" /><rect x="388" y="204" width="5" height="6" />
      </g>
      <rect x="356" y="40" width="8" height="240" fill="#FFF4DC" />
      <rect x="150" y="156" width="420" height="6" fill="#FFF4DC" opacity=".9" />
      {/* cuadro y planta */}
      <rect x="40" y="70" width="70" height="90" rx="6" fill="#D9643A" /><rect x="50" y="80" width="50" height="70" rx="4" fill="#FFF4DC" />
      <path d="M60 140 L75 100 L90 140 Z" fill="#8C6BB1" />
      <rect x="616" y="250" width="44" height="60" rx="8" fill="#B24E27" />
      <path d="M638 252 Q600 200 622 170 Q636 210 638 252 Q644 190 676 176 Q664 222 638 252" fill="#2F8A54" />
    </g>
  );
}
/* el escritorio va delante de las personas */
function Escritorio() {
  return (
    <g transform="translate(0 -78)">
      <rect x="60" y="372" width="600" height="26" rx="8" fill="#B24E27" />
      <rect x="80" y="398" width="560" height="97" fill="#8A3A1C" />
      <rect x="300" y="352" width="120" height="20" rx="3" fill="#FFF8EA" transform="rotate(-4 360 362)" />
      <rect x="440" y="340" width="40" height="32" rx="6" fill="#3B3358" /><rect x="446" y="346" width="28" height="18" rx="3" fill="#8C6BB1" />
      <circle cx="120" cy="362" r="12" fill="#FFF4DC" /><circle cx="120" cy="362" r="7" fill="#5B4785" />
    </g>
  );
}

/* ============================================================
   EL GUION Y LA CINEMÁTICA
   Cada línea dice quién habla y con qué cara; el texto aparece letra
   por letra y un toque lo completa o pasa a la siguiente.
   ============================================================ */
function Cinematica({ guion, onFin }) {
  const [i, setI] = useState(0);
  const [n, setN] = useState(0);
  const [firma, setFirma] = useState(false);
  const linea = guion.lineas[i];
  const completa = n >= linea.txt.length;
  useEffect(() => { setN(0); }, [i]);
  useEffect(() => {
    if (completa) return;
    const t = setTimeout(() => setN((x) => x + 2), 28);
    return () => clearTimeout(t);
  }, [n, completa]);
  const avanzar = () => {
    if (firma) return;
    if (!completa) { setN(linea.txt.length); return; }
    if (i < guion.lineas.length - 1) setI(i + 1);
    else if (guion.firma) setFirma(true);
    else onFin();
  };
  const gestoDe = (id) => {
    for (let k = i; k >= 0; k--) if (guion.lineas[k].quien === id && guion.lineas[k].gesto) return guion.lineas[k].gesto;
    return "neutro";
  };
  const quien = guion.elenco[linea.quien];
  return (
    <div className="ea-cine" onClick={avanzar}>
      <svg className="ea-cineEsc" viewBox="0 0 720 495" preserveAspectRatio="xMidYMid slice">
        <Oficina />
        {Object.keys(guion.elenco).map((id) => {
          const p = guion.elenco[id];
          return <Persona key={id} look={p.look} x={p.x} y={104} escala={1.32} mira={p.mira}
            gesto={gestoDe(id)} habla={linea.quien === id && !completa} entra={i === 0 ? (p.x < 360 ? "i" : "d") : null} />;
        })}
        <Escritorio />
      </svg>
      <div className="ea-cineLugar">{guion.lugar}</div>
      <button className="ea-cineSaltar" onClick={(e) => { e.stopPropagation(); guion.firma ? setFirma(true) : onFin(); }}>Saltar ›</button>
      {!firma && (
        <div className="ea-cineCaja">
          <div className="ea-cineQuien">{quien.nombre}</div>
          <p className="ea-cineTxt">{linea.txt.slice(0, n)}</p>
          {completa && <span className="ea-cineMas">▼</span>}
        </div>
      )}
      {firma && <Firma doc={guion.firma} onFin={onFin} />}
    </div>
  );
}

/* el contrato sobre la mesa: se firma con un toque */
function Firma({ doc, onFin }) {
  const [firmado, setFirmado] = useState(false);
  return (
    <div className="ea-firma" onClick={(e) => e.stopPropagation()}>
      <div className="ea-firmaDoc">
        <p className="ea-firmaT">{doc.titulo}</p>
        <p className="ea-firmaS">{doc.entre}</p>
        {doc.terminos.map(([k, v]) => (
          <div className="ea-firmaFila" key={k}><span>{k}</span><b>{v}</b></div>
        ))}
        <div className="ea-firmaLinea">
          {firmado && (
            <svg className="ea-firmaTrazo" viewBox="0 0 200 50">
              <path d="M6 34 C 18 6, 30 6, 26 30 S 40 44, 52 22 S 70 8, 74 30 Q 80 40, 92 26 T 120 28 C 130 20, 142 40, 156 22 S 182 30, 194 18" />
            </svg>
          )}
          {firmado && <div className="ea-firmaSello">FIRMADO</div>}
          <span>Tu firma</span>
        </div>
        {!firmado
          ? <button className="ea-btnC" onClick={() => setFirmado(true)}>Firmar</button>
          : <button className="ea-btnC" onClick={onFin}>Continuar</button>}
      </div>
    </div>
  );
}

/* ---- la muestra: se te vence el contrato ---- */
const GUION = {
  lugar: "Oficina de Marta · Brújula Macro · 2032",
  elenco: {
    jefa: { nombre: "Marta, tu jefa", x: 500, mira: -1,
      look: { piel: "#C68B62", pelo: "largo", colorPelo: "#3B2A22", ropa: "#5B4785", cuello: "#FFF4DC", lentes: true } },
    yo: { nombre: "Tú", x: 220, mira: 1,
      look: { piel: "#E7B48A", pelo: "corto", colorPelo: "#2A2440", ropa: "#2F5D8A", corbata: "#D9643A", cuello: "#FFF4DC" } },
  },
  lineas: [
    { quien: "jefa", gesto: "neutro", txt: "Pasa, siéntate. Ya sabes para qué te llamé: se te vence el contrato este mes." },
    { quien: "yo", gesto: "serio", txt: "Sí. Y la verdad, quería hablarte de eso. Este año cerré los tres mandatos más grandes del equipo." },
    { quien: "jefa", gesto: "serio", txt: "Lo sé, lo sé. Mira, te puedo ofrecer lo mismo de siempre: un 4% más y tres años." },
    { quien: "yo", gesto: "serio", txt: "Con todo respeto, Marta, eso no da. Tengo una oferta de otra firma sobre la mesa." },
    { quien: "jefa", gesto: "sorpresa", txt: "¿Ah, sí? ... Bueno. Dime tu número y vemos qué se puede hacer." },
    { quien: "yo", gesto: "neutro", txt: "Un 18% más, y firmo por cuatro años. Me quedo y me comprometo." },
    { quien: "jefa", gesto: "feliz", txt: "Me la pusiste difícil, pero te lo ganaste. Trato hecho. Firma aquí." },
  ],
  firma: {
    titulo: "Contrato de trabajo",
    entre: "Entre Brújula Macro y tú",
    terminos: [["Sueldo al año", "USD 52.000 (+18%)"], ["Años", "4"], ["Cargo", "Asociado"]],
  },
};

function Demo() {
  const [fin, setFin] = useState(false);
  const [vez, setVez] = useState(0);
  return (
    <div className="ea-root demo">
      {!fin
        ? <Cinematica key={vez} guion={GUION} onFin={() => setFin(true)} />
        : (
          <div className="demoFin">
            <h2>Aquí sigue la carta de la escena, como siempre.</h2>
            <button className="ea-btnC" style={{ maxWidth: 260 }} onClick={() => { setFin(false); setVez(vez + 1); }}>Ver otra vez</button>
          </div>
        )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("raiz")).render(<Demo />);
</script>
</body>
</html>
